<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <span>My Chatbot</span>
            <span id="calendarStatus" class="calendar-status" title="Google Calendar"></span>
        </div>

        <div id="connectBanner" class="connect-banner" hidden>
            <span>Connect Google Calendar to add events.</span>
            <button id="connectButton">Connect Google Calendar</button>
        </div>

        <div id="messages" class="messages">
        </div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
